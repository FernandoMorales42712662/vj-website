<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luis Morales | Visual Artist</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<header class="hero">

<div class="overlay"></div>

<div class="hero-content">

<h1>Luis Morales</h1>

<p class="subtitle">
Visual Artist & VJ
</p>

<p class="tagline">
Experiencias visuales para eventos únicos
</p>

<div class="hero-buttons">

<a href="#portfolio" class="btn-outline">Portfolio</a>

<a href="#contact" class="btn-gold">Reservar Fecha</a>

</div>

</div>

</header>

<section class="services">

<h2>Eventos</h2>

<div class="services-grid">

<div class="service-card">Casamientos</div>
<div class="service-card">Cumpleaños de 15</div>
<div class="service-card">Cumpleaños de 18</div>
<div class="service-card">Eventos corporativos</div>
<div class="service-card">Clubes & fiestas</div>

</div>

</section>

<section id="portfolio" class="portfolio">

<h2>Visuals</h2>

<div class="gallery">

<div class="video-box"></div>
<div class="video-box"></div>
<div class="video-box"></div>

</div>

</section>

<section id="contact" class="contact">

<h2>Contacto</h2>

<form>

<input type="text" placeholder="Nombre">

<input type="text" placeholder="Tipo de evento">

<input type="date">

<textarea placeholder="Mensaje"></textarea>

<button>Consultar disponibilidad</button>

</form>

</section>

<script src="js/script.js"></script>

</body>
</html>
